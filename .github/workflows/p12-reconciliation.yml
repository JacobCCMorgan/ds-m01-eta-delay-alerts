name: P12 evidence audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: P12 contract reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out audited commit and its frozen ancestors
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install locked project dependencies
        run: |
          python -m pip install -r requirements-models.lock -r workflows/p10/requirements-integration.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Run P12 regressions
        run: python -I -B -m unittest discover -s workflows/p12/tests -v

      - name: Reconcile all P12 items
        shell: bash
        run: |
          set -euo pipefail
          python -I -B workflows/p12/check_reconciliation.py --root . --require-ready | tee "$RUNNER_TEMP/p12-audit.json"

      - name: Upload reconciliation result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p12-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p12-audit.json
          if-no-files-found: error
          retention-days: 30
